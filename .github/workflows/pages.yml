name: Publicar Gestão Pecuária no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar site na raiz
        run: |
          mkdir -p _site
          cp preview/index.html _site/index.html
          cp preview/preview.js _site/preview.js
          cp preview/preview.css _site/preview.css
          cp src/styles.css _site/styles.css
          sed -i 's#../src/styles.css#./styles.css#g' _site/index.html
      - name: Preparar conteúdo estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
